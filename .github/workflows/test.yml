name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build tests
        run: |
           gcc \
                tests/machine/test_vibration.c \
                src/machine/vibration.c \
                src/common/signal_validation.c \
                src/oscillator/oscillator.c \
                -Iinclude \
                -Iinc \
                -lm \
                -g \
                -Wall \
                -Wextra \
                -o test_vibration

      - name: Run tests
        run: ./test_vibration